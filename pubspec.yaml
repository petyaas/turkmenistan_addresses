name: turkmenistan_addresses
description: >-
  Offline address search for Turkmenistan: cities and villages, streets
  and houses. The database ships inside the package, no network needed.
version: 1.0.0
repository: https://github.com/petyaas/turkmenistan_addresses
issue_tracker: https://github.com/petyaas/turkmenistan_addresses/issues

topics:
  - geocoding
  - offline
  - openstreetmap
  - addresses
  - turkmenistan

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/turkmenistan.adb
